# What the pipeline fetches from vacancy sources.
#
# Adzuna findings (probe of 2026-09-19):
# - The IT category alone misses most ICT vacancies: many sit in category "unknown" or
#   "engineering-jobs". So we also run keyword searches across all categories; the classifier
#   decides afterwards what counts as ICT.
# - Descriptions are truncated to ~500 characters by the API.
# - Per 8 days: ~630 ads in it-jobs, ~1,900 via the keyword search (about 55 API calls a week).
#   Daily with a 3-day window: ~90 ads in it-jobs and ~750 via keywords, about 18 calls a day
#   (~550 a month), well inside the plan.
#
# Coverage probe of 2026-09-20: the national queries already find what the API has per
# region. Of the 17 IT ads within 20 km of Alkmaar over 30 days, 15 were already in the
# database (the other two were posted after the last run). Adding `where=<place>` queries
# per region would therefore spend call budget without adding vacancies; the thin regional
# numbers are the API's coverage, not ours. Adzuna's own count per 30 days and 20 km:
#   Amsterdam 276 | Haarlem 264 | Eindhoven 67 | Alkmaar 17 | Hoorn 12 | Leeuwarden 8.
#
# Depth probe of 2026-09-20: the index does hold older ads, but only those still listed.
# it-jobs by max_days_old: 8 d 722 | 30 d 1,651 | 60 d 2,135 | 90 d 2,496 | 365 d 3,226.
# Per month that is ~1,651 for the last month, ~484 for the month before, ~361, then ~126
# and ~57: after a month roughly 30% of the ads are still listed, after half a year ~5%.
# A backfill is therefore only good for extra text to check the rules against, never for
# counts over time — hence `jobmarket ingest --backfill`, which keeps those vacancies out
# of the published figures. Reaching back a full year costs about 450 calls
# ((3,226 + 19,073) / 50), so two days of budget.

adzuna:
  country: nl
  results_per_page: 50
  # Throttling. Plan limits (owner's dashboard, 2026-09-19): 25/minute, 250/day, 1,000/week,
  # 2,500/month. A weekly run needs ~55 calls; a 30-day backfill needed 178.
  # 3 s between calls = 20/minute. The per-run cap stays below the daily limit so a manual
  # check on the same day still fits.
  min_seconds_between_calls: 3
  max_calls_per_run: 200
  # Kept across runs in the api_calls table, so several runs on one day cannot together pass the
  # plan limits. Set a little below the real limits, leaving room for a manual check.
  max_calls_per_day: 220
  max_calls_per_week: 900
  max_calls_per_month: 2300
  # Days of history a normal run asks for. The job runs daily, so two days gives a day of
  # overlap: a missed or failed run heals itself the next day. Measured on 2026-09-20: a 3-day
  # window costs 40 calls and a day holds ~640 ads, so a daily 2-day window costs ~27 calls
  # (~800 a month) and leaves the rest of the plan for checks and a one-off backfill.
  default_days: 2
  queries:
    - id: it-category
      params: { category: it-jobs }
    - id: ict-keywords
      # what_or: any of these words, anywhere in the ad, in any category (single words only)
      params:
        what_or: >-
          developer ontwikkelaar programmeur software softwareontwikkelaar devops fullstack
          backend frontend embedded firmware iot plc scada netwerkbeheerder systeembeheerder
          informatieanalist applicatiebeheerder cybersecurity tester scrum python java
          javascript kubernetes

# EURES publishes what the national employment services collect; for the Netherlands that is
# UWV. No key, no plan limits, but it is the portal's own API, so we keep the pace polite and
# cap a run. Measured on 2026-09-20: 6,034 ICT vacancies listed, ~574 changed a day, of which
# roughly a third are new. A daily run therefore costs ~12 search calls plus one detail call
# per new vacancy (~200), about four minutes.
#
# Which vacancies count as ICT is the source's own ESCO classification, from the ISCO groups in
# data/reference/esco_occupations.yaml (`jobmarket reference update-occupations`).
eures:
  country: nl
  results_per_page: 50
  min_seconds_between_calls: 1
  # A day needs ~12 search calls plus one detail call per new vacancy; the first run on a
  # new server faces a backlog, so the cap leaves room. A run that hits it says so and
  # continues the next day.
  max_calls_per_run: 600
  # The search filters on the moment a vacancy last changed, so one day of overlap is enough.
  default_days: 1
