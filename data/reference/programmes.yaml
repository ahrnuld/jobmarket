# Programmes and role families (DR-04).
#
# A vacancy maps to every programme whose role family matches its title. A role family can serve
# several programmes, or none: a family with `programmes: []` marks a vacancy as ICT without
# assigning it to a programme (e.g. IT support, which is mostly MBO level).
#
# Title patterns are case-insensitive regular expressions, matched against the normalised title:
# lowercase, gender markers such as "(m/v/x)" removed, and hyphens, slashes and '&' turned into
# spaces ("PLC-programmeur" -> "plc programmeur", "Business & IT Analist" -> "business it analist").
# Dutch and English titles are both covered (DR-06).
#
# Pattern idiom: `\b(tech words)\b(?:\s+\S+){0,2}\s+(role words)\b` allows up to two words in
# between, so "AI/GenAI Engineer" and "Network and Integration Engineer" match as well.
#
# exclude_title_patterns: titles that are never counted as ICT through the fallback rule
# ("in the source's IT category and mentions a technical skill"). A role family match still wins.
#
# Revision 2 (2026-09-19) is based on the first 30 days of real Adzuna data.
# Revision 3 (2026-09-20), reviewed by the owner: cloud, DevOps, security and network or
# infrastructure work is not what Technische Informatica trains for. That programme is about
# embedded systems, IoT, domotics, robotics and industrial automation; by the earlier mapping a
# software developer would have belonged to it just as much as a cloud engineer. Changes here
# are methodology changes: add a changelog entry (FR-22 / TR-06).

programmes:
  - id: informatica
    name: { nl: Informatica, en: Computer Science }
    locations: [Haarlem]
    summary:
      nl: Softwareontwikkeling, data en AI, security en cloud.
      en: Software development, data and AI, security and cloud.
  - id: business-it-management
    name: { nl: Business IT & Management, en: Business IT & Management }
    locations: [Alkmaar, Amsterdam]
    summary:
      nl: IT en organisatie verbinden - analyse, advies, data-analyse en projectmanagement.
      en: Linking IT and organisations - analysis, consulting, data analysis and project management.
  - id: technische-informatica
    name: { nl: Technische Informatica, en: Computer Engineering }
    locations: [Alkmaar]
    summary:
      nl: Embedded systemen, IoT, domotica, robotica en industriele automatisering.
      en: Embedded systems, IoT, home automation, robotics and industrial automation.

exclude_title_patterns:
  - '\b(sales|verkoop|account\s*(manager|executive)|accountmanager|business developer|new business)\b'
  - '\b(marketing|marketeer|content creator|creator|affiliate|influencer|social media|copywriter)\b'
  - '\b(recruiter|recruitment|talent acquisition|hr)\b'
  - '\b(monteur|elektromonteur|werkvoorbereider|tekenaar|calculator|uitvoerder|installateur)\b'
  - '\b(mechanical|werktuigbouw\w*|elektrotechni\w*|electrical|civiele|bouwkundig\w*|commissioning)\b'

role_families:
  # --- Informatica -------------------------------------------------------------------------------
  - id: software-developer
    name: { nl: Softwareontwikkelaar, en: Software developer }
    programmes: [informatica]
    title_patterns:
      - '(?<!embedded )\b(software|applicatie|application)\s*(developer|ontwikkelaar|engineer|programmeur)\b'
      - '\b(\.net|c#|java|python|php|golang|go|ruby|kotlin|scala|typescript|node(\.js)?|rust|elixir)\s*(developer|ontwikkelaar|engineer|programmeur)\b'
      - '(?<!embedded )\b(back ?end|full ?stack|software|staff|platform|gamedev|serverless|saas)\b(?:\s+\S+){0,3}\s+(developer|ontwikkelaar|engineer)\b'
      - '(?<!business )(?<!sales )(?<!product )(?<!project )(?<!vastgoed )(?<!property )\bdeveloper\b'
      - '^(ontwikkelaar|programmeur)$'
      - '\b(software|systeem|applicatie|web|app)\s*ontwikkelaar\b'
      - '\b(low code|no code|servicenow|outsystems|mendix|power platform|salesforce|abap)\b(?:\s+\S+){0,2}\s+(developer|ontwikkelaar|engineer)\b'
      - '\b(software|tech|technical|development|engineering)\s+(team\s+)?lead\b'
      - '\b(junior|medior|senior|lead|stagiair[e]?|trainee|graduate)\s+(ontwikkelaar|programmeur)\b'
  - id: web-mobile-developer
    name: { nl: Web- en mobile developer, en: Web and mobile developer }
    programmes: [informatica]
    title_patterns:
      - '\b(web|front ?end|react|angular|vue|javascript)\b(?:\s+\S+){0,3}\s+(developer|ontwikkelaar|engineer)\b'
      - '\b(mobile|app|ios|android|flutter|react native)\s*(developer|ontwikkelaar|engineer)\b'
  - id: software-architect
    name: { nl: Software- en IT-architect, en: Software and IT architect }
    programmes: [informatica]
    title_patterns:
      - '\b(software|solution|solutions|technical|integration|data|enterprise|it|ict)\s+architect\b'
  - id: data-ai-engineer
    name: { nl: Data- en AI-engineer, en: Data and AI engineer }
    programmes: [informatica]
    title_patterns:
      - '\b(data|ai|genai|ml|machine learning|deep learning|databricks|pyspark|spark|mlops|llm|computer vision)\b(?:\s+\S+){0,2}\s+(engineer|scientist|developer)\b'
      - '\bdata\s*(modeler|modeller|integration specialist)\b'
      - '\bprompt engineer\b'
      - '\bdata science\b'
  - id: devops-cloud-engineer
    name: { nl: DevOps- en cloud-engineer, en: DevOps and cloud engineer }
    programmes: [informatica]
    title_patterns:
      - '\b(devops|dev ops|cloud|platform|site reliability|sre|azure|aws|gcp|kubernetes|monitoring|middleware)\b(?:\s+\S+){0,2}\s+(engineer|specialist|architect|consultant|developer|administrator)\b'
      - '\bengineer\s+(infra|cloud|devops|linux)\b'
  - id: security-specialist
    name: { nl: Security-specialist, en: Security specialist }
    programmes: [informatica]
    title_patterns:
      - '\b(cyber\s*security|cybersecurity|security|cyber|soc|siem|iam|identity)\b(?:\s+\S+){0,2}\s+(engineer|specialist|analist|analyst|officer|consultant|architect|expert)\b'
      - '\b(pentester|penetration tester|ethical hacker)\b'
      - '\b(cyberark|sailpoint|okta|entra id|isim)\b(?:\s+\S+){0,2}\s+(engineer|specialist|consultant|architect)\b'
  - id: software-tester
    name: { nl: Tester / QA-engineer, en: Tester / QA engineer }
    programmes: [informatica]
    title_patterns:
      - '\b(software\s*)?(tester|test engineer|test automation engineer|test automation specialist|qa engineer|quality assurance engineer|testanalist|test analyst)\b'
      - '\b(qa|test|quality assurance)\b(?:\s+\S+){0,2}\s+(engineer|specialist|analist|analyst)\b'
  - id: game-developer
    name: { nl: Game developer, en: Game developer }
    programmes: [informatica]
    title_patterns:
      - '\b(game|gamedev|unity|unreal)\b(?:\s+\S+){0,2}\s+(developer|ontwikkelaar|programmer|programmeur|engineer)\b'

  # --- Business IT & Management ------------------------------------------------------------------
  - id: business-functional-analyst
    name: { nl: Business- of functioneel analist, en: Business or functional analyst }
    programmes: [business-it-management]
    title_patterns:
      - '\b(business|functioneel|functional|informatie|information|requirements|it|ict|proces|process|systems|systeem)\b(?:\s+\S+){0,2}\s+(analist|analyst)\b'
      - '\binformatieanalist\b'
      - '\b(business\s+(and\s+)?it|it|ict)\s+traineeship\b'
      - '\btraineeship\s+(business\s+(and\s+)?)?(it|ict)\b'
  - id: functional-application-manager
    name: { nl: Functioneel beheerder, en: Functional application manager }
    programmes: [business-it-management]
    title_patterns:
      - '\b(functioneel|functional)\s*(applicatie)?\s*(beheerder|administrator)\b'
      - '\bfunctional (application )?manager\b'
  - id: technical-application-manager
    name: { nl: Technisch applicatiebeheerder, en: Technical application specialist }
    programmes: [business-it-management, informatica]
    title_patterns:
      - '\b(applicatie|application|technisch|technical)\s*(beheerder|specialist|administrator)\b'
      - '\b(technisch\s+)?applicatiespecialist\b'
      - '\bapplication (management|support|packaging) (engineer|specialist)\b'
  - id: it-consultant
    name: { nl: IT-consultant, en: IT consultant }
    programmes: [business-it-management]
    title_patterns:
      - '\b(it|ict|erp|crm|sap|salesforce|dynamics|digital|ifs|oracle|servicenow|topdesk|microsoft 365|m365|sharepoint|power platform|power bi)\b(?:\s+\S+){0,2}\s+(consultant|adviseur|advisor|key user)\b'
      - '\b(functional|functioneel)\s+(consultant|adviseur)\b'
  - id: data-bi-analyst
    name: { nl: Data- en BI-analist, en: Data and BI analyst }
    programmes: [business-it-management]
    title_patterns:
      - '\b(data|bi|business intelligence|reporting|power bi)\b(?:\s+\S+){0,2}\s+(analist|analyst|consultant)\b'
      - '\b(bi|business intelligence|power bi|reporting)\s+(engineer|developer|ontwikkelaar|specialist)\b'
  - id: product-project-role
    name: { nl: Product owner / IT-projectleider, en: Product owner / IT project lead }
    programmes: [business-it-management]
    title_patterns:
      - '\b(product owner|scrum master|agile coach|technical product manager)\b'
      - '\b(it|ict)\s*(project\s*(manager|leider)|projectleider|projectmanager|program(me)? manager|programmamanager|delivery manager|service manager|manager|co[oö]rdinator)\b'
      - '\b(projectleider|project\s*manager|programmamanager|program manager)\s+(it|ict)\b'
  - id: it-auditor
    name: { nl: IT-auditor, en: IT auditor }
    programmes: [business-it-management]
    title_patterns:
      - '\b(it|ict)\s*(audit\w*|risk|compliance|internal controls?)\b'

  # --- Technische Informatica --------------------------------------------------------------------
  - id: embedded-engineer
    name: { nl: Embedded software-engineer, en: Embedded software engineer }
    programmes: [technische-informatica]
    title_patterns:
      - '\b(embedded|firmware)\b(?:\s+\S+){0,2}\s+(developer|ontwikkelaar|engineer|programmeur|architect)\b'
      # The technology often follows the role: "Test Engineer - Embedded Software".
      - '\b(developer|ontwikkelaar|engineer|programmeur|architect|specialist)\b(?:\s+\S+){0,2}\s+(embedded|firmware)\b'
      - '\b(c\+\+|c)\s+(developer|ontwikkelaar|engineer)\b'
      - '\b(microcontroller|rtos)\b'
  - id: iot-engineer
    name: { nl: IoT-engineer, en: IoT engineer }
    programmes: [technische-informatica]
    title_patterns:
      - '\b(iot|internet of things)\b(?:\s+\S+){0,2}\s+(developer|ontwikkelaar|engineer|specialist|architect)\b'
      - '\b(developer|ontwikkelaar|engineer|specialist|architect|consultant)\b(?:\s+\S+){0,2}\s+(iot|internet of things)\b'
      - '\b(domotica|home automation|smart building)\b'
  - id: industrial-automation
    name: { nl: Industriele automatisering, en: Industrial automation engineer }
    programmes: [technische-informatica]
    title_patterns:
      # "PLC Software Engineer", "Software Engineer Machinebesturing & PLC": the technology can
      # stand on either side of the role word, with a word or two in between.
      - '\b(plc|scada|dcs|hmi|robotica|robotics|mechatronica|mechatronics|machinebesturing|besturings\w*)\b(?:\s+\S+){0,2}\s+(programmeur|programmer|engineer|ingenieur|ontwikkelaar|developer|specialist|architect)\b'
      - '\b(programmeur|engineer|ingenieur|ontwikkelaar|developer|specialist|architect)\b(?:\s+\S+){0,2}\s+(plc|scada|dcs|robotica|robotics|machinebesturing|mechatronica)\b'
      - '\b(industrial|industri[eë]le)\s+(controls?|automation|automatisering)\b'
      # Plain "automation" is only industrial when nothing says it is marketing, test or
      # process automation, which are other trades entirely.
      - '(?<!marketing )(?<!test )(?<!java )(?<!bpmn )(?<!rpa )(?<!sales )(?<!proces )(?<!process )(?<!ai )(?<!qa )(?<!assurance )(?<!network )(?<!netwerk )(?<!operations )\b(automation|automatisering)\s+(engineer|ingenieur|specialist)\b'
      - '(?<!document )\bcontrols?\s+(systems?\s+)?engineer\b'
      - '\bbesturingstechnic\w+\b'
      - '\b(ot|operational technology)\s+(security|engineer|specialist)\b'
  # Infrastructure is hardware, but not the hardware Technische Informatica is about (embedded,
  # IoT, domotics, robotics), and it is not software engineering either: no programme here.
  # --- ICT, no programme ---------------------------------------------------------------------
  - id: network-infrastructure-engineer
    name: { nl: Netwerk- en infrastructuurspecialist, en: Network and infrastructure engineer }
    programmes: []
    title_patterns:
      - '\b(netwerk|network|infrastructuur|infrastructure|system|systeem|systems|windows|linux|storage|server|database|data base|dba|werkplek)\s*(engineer|beheerder|administrator|specialist|architect|beheer)\b'
      - '\b(netwerk|network|infrastructuur|infrastructure|storage|database)\b(?:\s+\S+){1,2}\s+(engineer|beheerder|administrator|specialist)\b'
      - '\bsysteembeheer\b'

  - id: it-support
    name: { nl: IT-support en servicedesk, en: IT support and service desk }
    programmes: []
    title_patterns:
      - '\b(it|ict)\s*(support|servicedesk|service desk|helpdesk|medewerker|specialist|engineer|technician|coordinator)\b'
      - '\b(servicedesk|service desk|helpdesk)\w*'
      - '\b(tweedelijns|eerstelijns|derdelijns|technical|technisch|workplace)?\s*support engineer\b'
      - '\bsupport\s*medewerker\s+(it|ict)\b'
      - '\bdata ?cent(er|re) technician\b'
      - '\b(allround\s+)?(it|ict)\s*supportmedewerker\b'
