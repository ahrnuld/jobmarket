# Published statistics shown next to the vacancy data (section 3 of REQUIREMENTS.md).
#
# CBS series are fetched from the open StatLine OData API (https://opendata.cbs.nl/). Table ids
# and dimension keys were checked against the API on 2026-09-19. `filters` pins every dimension
# that is not broken down; `regions` / `breakdowns` map CBS keys onto our own ids.
#
# Manual series have no API we can use yet. Their figures are copied from the publications into
# data/manual/<source_id>.csv; see data/manual/README.md. Every series used in a CSV must be
# declared here, so the site knows its title, unit, underlying source (`origin`) and meaning.

cbs:
  - series_id: cbs_vacancies_ict_sector
    table: 80474ned
    measure: VacaturesSeizoengecorrigeerd_1
    multiplier: 1000
    unit: vacancies
    frequency: quarter
    filters: { SBI2008PartBedrijvenOverheid: "391600" }
    title:
      nl: Openstaande vacatures in de sector Informatie en communicatie (seizoengecorrigeerd)
      en: Open vacancies in the Information and communication sector (seasonally adjusted)
    note:
      nl: >-
        Sector J telt alle vacatures bij ICT-bedrijven, ook niet-ICT-functies, en mist
        ICT-functies bij bijvoorbeeld banken of de overheid.
      en: >-
        Sector J counts all vacancies at ICT companies, including non-ICT roles, and misses ICT
        roles at e.g. banks or government.

  - series_id: cbs_open_vacancies_ict_sector_region
    table: 83599NED
    measure: OpenstaandeVacatures_1
    multiplier: 1000
    unit: vacancies
    frequency: quarter
    filters: { BedrijfstakkenBranchesSBI2008: "391600" }
    region_dimension: RegioS
    regions:
      NL01: NL
      PV20: groningen
      PV21: friesland
      PV22: drenthe
      PV23: overijssel
      PV24: flevoland
      PV25: gelderland
      PV26: utrecht
      PV27: noord-holland
      PV28: zuid-holland
      PV29: zeeland
      PV30: noord-brabant
      PV31: limburg
    title:
      nl: Openstaande vacatures in de sector Informatie en communicatie, per provincie
      en: Open vacancies in the Information and communication sector, per province

  - series_id: cbs_new_vacancies_ict_occupations
    table: 85081NED
    measure: OntstaneVacatures_1
    multiplier: 1000
    unit: vacancies
    frequency: year
    filters: { BedrijfstakkenBranchesSBI2008: T001081 }
    breakdown_dimension: Beroepenindeling
    breakdowns: { A000273: ict-occupations, A000274: ict-specialists, A000277: ict-technicians }
    title:
      nl: Ontstane vacatures in ICT-beroepen, alle sectoren (per jaar)
      en: New vacancies in ICT occupations, all sectors (per year)
    note:
      nl: >-
        Beroepenindeling ROA-CBS 2014. 'Specialisten ICT' is grofweg hbo/wo-niveau,
        'Vakspecialisten ICT' mbo-niveau.
      en: >-
        ROA-CBS 2014 occupation classification. 'ICT specialists' is roughly higher-education
        level, 'ICT technicians' vocational level.

  - series_id: cbs_employed_ict_occupations
    table: 86320NED
    measure: WerkzameBeroepsbevolking_1
    multiplier: 1000
    unit: persons
    frequency: quarter
    filters: { Geslacht: T001038, Persoonskenmerken: T009002 }
    breakdown_dimension: Beroep
    breakdowns:
      A000273: ict-occupations
      A000218: ict-managers
      A000276: system-network-specialists
      A059353: system-analysts-advisers
      A059354: software-developers
      A000278: user-support
    title:
      nl: Werkenden in ICT-beroepen
      en: Employed persons in ICT occupations

manual:
  # Labour market outcomes per programme, from the Studiekeuzedatabase of the Landelijk Centrum
  # Studiekeuze as shown on Studiekeuze123 (national figures per study, full-time graduates).
  # `origin` is the underlying source, shown next to every figure. Breakdown: a programme id, or
  # 'hbo-bachelor' for the national average of all hbo bachelors. The figures are computed per
  # group of related programmes (SOI rubriek), so related programmes can share identical values.
  - series_id: sk_starting_salary
    source_id: studiekeuze123
    origin: CBS Microdata
    unit: eur_month_gross
    breakdown: programme
    title:
      nl: Geschat bruto startsalaris per maand
      en: Estimated gross starting salary per month
  - series_id: sk_job_at_level
    source_id: studiekeuze123
    origin: HBO-Monitor
    unit: percent
    breakdown: programme
    title:
      nl: Afgestudeerden met een baan op het niveau van de studie
      en: Graduates with a job at the level of their studies
  - series_id: sk_job_in_field
    source_id: studiekeuze123
    origin: HBO-Monitor
    unit: percent
    breakdown: programme
    title:
      nl: Afgestudeerden met een baan in het vakgebied
      en: Graduates with a job in their field
  - series_id: sk_months_to_job
    source_id: studiekeuze123
    origin: CBS Microdata
    unit: months
    breakdown: programme
    title:
      nl: Gemiddelde tijd tot een substantiële baan
      en: Average time to a substantial job
  - series_id: sk_permanent_contract
    source_id: studiekeuze123
    origin: CBS Microdata
    unit: percent
    breakdown: programme
    title:
      nl: Werkende afgestudeerden met een vast contract
      en: Working graduates with a permanent contract
  - series_id: sk_hours_per_week
    source_id: studiekeuze123
    origin: CBS Microdata
    unit: hours
    breakdown: programme
    title:
      nl: Gemiddeld aantal werkuren per week
      en: Average working hours per week
  - series_id: sk_outlook
    source_id: studiekeuze123
    origin: ROA
    unit: label
    breakdown: programme
    title:
      nl: Arbeidsmarktperspectief (ROA-prognose)
      en: Labour market outlook (ROA forecast)
    note:
      nl: Een prognose is een scenario, geen zekerheid (LR-06).
      en: A forecast is a scenario, not a certainty (LR-06).
  - series_id: sk_occupation
    source_id: studiekeuze123
    origin: HBO-Monitor
    unit: percent
    breakdown: programme_item   # '<programme id>/<occupation>'
    title:
      nl: Beroepen van afgestudeerden, anderhalf jaar na afstuderen
      en: Occupations of graduates, about a year and a half after graduating

  # Defined for later use; no data yet.
  - series_id: uwv_tension
    source_id: uwv
    origin: UWV
    unit: label
    breakdown: occupation
    title:
      nl: Spanning op de arbeidsmarkt voor ICT-beroepen (UWV)
      en: Labour market tightness for ICT occupations (UWV)
