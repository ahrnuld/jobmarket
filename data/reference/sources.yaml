# Source register (DR-01, LR-01). One entry per data source.
#
# terms_checked_on: the date the OWNER last read the source's terms and confirmed this use is allowed.
# It is null for every source until that check has happened. In production mode
# (JOBMARKET_ENV=production) the pipeline refuses to publish figures from a source with
# terms_checked_on: null.
#
# The licence descriptions below come from general knowledge, not a legal check; verify them.

sources:
  - id: adzuna
    name: Adzuna
    url: https://www.adzuna.nl/
    licence: Adzuna API terms (free key; attribution required)
    licence_url: https://developer.adzuna.com/docs/terms_of_service
    attribution: "Jobs by Adzuna"
    raw_retention_days: 90          # VERIFY against Adzuna terms before launch
    terms_checked_on: null
    release: mvp

  - id: cbs
    name: CBS StatLine
    url: https://opendata.cbs.nl/
    licence: CC BY 4.0
    licence_url: https://www.cbs.nl/en-gb/about-us/website/copyright
    attribution: "Source: CBS"
    raw_retention_days: null
    terms_checked_on: null
    release: mvp

  - id: roa
    name: ROA (Maastricht University), labour market forecasts
    url: https://roa.nl/
    licence: Public report; quote with source reference
    licence_url: https://roa.nl/
    attribution: "Source: ROA, Maastricht University"
    raw_retention_days: null
    terms_checked_on: null
    release: mvp

  - id: hbo_monitor
    name: HBO-Monitor
    url: https://www.vereniginghogescholen.nl/
    licence: Public tables; quote with source reference
    licence_url: https://www.vereniginghogescholen.nl/
    attribution: "Source: HBO-Monitor"
    raw_retention_days: null
    terms_checked_on: null
    release: mvp

  # Labour market outcomes per programme: Studiekeuzedatabase of the Landelijk Centrum Studiekeuze
  # (LCSK), as shown on Studiekeuze123. Underlying sources: CBS Microdata, HBO-Monitor, ROA. LCSK
  # requires it to be named clearly as the source. Figures copied by hand from the national study
  # pages until database access (free, on request) is arranged.
  - id: studiekeuze123
    name: Studiekeuze123 (Landelijk Centrum Studiekeuze)
    url: https://www.studiekeuze123.nl/
    licence: Studiekeuzedatabase, LCSK delivery terms; name LCSK as the source
    licence_url: https://lcsk.nl/over-ons/leveringsvoorwaarden/
    attribution: "Bron: Landelijk Centrum Studiekeuze (Studiekeuze123)"
    raw_retention_days: null
    terms_checked_on: null
    release: mvp

  - id: esco
    name: ESCO (European Skills, Competences, Qualifications and Occupations)
    url: https://esco.ec.europa.eu/
    licence: European Commission reuse policy (Decision 2011/833/EU)
    licence_url: https://esco.ec.europa.eu/en/about-esco/data-science-and-esco/esco-and-open-data
    attribution: "ESCO, European Commission"
    raw_retention_days: null
    terms_checked_on: null
    release: mvp

  - id: uwv
    name: UWV, occupation outlook and regional labour market
    url: https://www.werk.nl/arbeidsmarktinformatie/
    licence: Public information; quote with source reference
    licence_url: https://www.uwv.nl/
    attribution: "Source: UWV"
    raw_retention_days: null
    terms_checked_on: null
    release: mvp

  # Not a real source: synthetic vacancies used until an Adzuna key is configured.
  # Anything derived from it is marked as sample data on the site.
  - id: fixture
    name: Synthetic sample data (not real vacancies)
    url: https://example.invalid/
    licence: Synthetic, generated by the pipeline
    licence_url: null
    attribution: "Sample data, not real"
    raw_retention_days: 90
    terms_checked_on: "2026-09-19"
    release: mvp
