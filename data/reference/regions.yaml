# Geography for the region filter (FR-07) and the map.
#
# The municipality table itself is generated: data/reference/municipalities.csv, built by
# `jobmarket reference update-regions` from CBS "Gebieden in Nederland" (one table per year,
# 2010-2026). It links every municipality name to its COROP area, labour market region and
# province, including names that no longer exist (vacancy sources still use them).
#
# This file holds only what cannot be generated: our own province ids with the spellings sources
# use, id overrides that keep published region ids stable, and name aliases for municipalities
# a source spells differently.

provinces:
  - { id: noord-holland, name: Noord-Holland, aliases: [North Holland, Noord Holland] }
  - { id: zuid-holland, name: Zuid-Holland, aliases: [South Holland, Zuid Holland] }
  - { id: utrecht, name: Utrecht, aliases: [] }
  - { id: noord-brabant, name: Noord-Brabant, aliases: [North Brabant, Noord Brabant] }
  - { id: gelderland, name: Gelderland, aliases: [] }
  - { id: overijssel, name: Overijssel, aliases: [] }
  - { id: limburg, name: Limburg, aliases: ["Limburg (NL)"] }
  - { id: groningen, name: Groningen, aliases: [] }
  - { id: friesland, name: Friesland, aliases: [Fryslan, Fryslân, "Friesland (NL)"] }
  - { id: drenthe, name: Drenthe, aliases: [] }
  - { id: flevoland, name: Flevoland, aliases: [] }
  - { id: zeeland, name: Zeeland, aliases: [] }

# CBS name -> the id already used in the published history. Without these, a new id would appear
# and the trend of that region would break.
region_id_overrides:
  FoodValley: food-valley
  Gooi en Vechtstreek: gooi-vechtstreek
  Veluwe Stedendriehoek: stedendriehoek
  Zuid-Kennemerland en IJmond: zuid-kennemerland-ijmond

# Municipality names as a source writes them -> the name in municipalities.csv.
municipality_aliases:
  Den Haag: "'s-Gravenhage"
  Nuenen: "Nuenen, Gerwen en Nederwetten"
