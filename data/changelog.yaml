# Public methodology changelog (FR-22, TR-06). Newest first. Shown on the methodology page.
# Add entries with `jobmarket admin changelog add`, or edit by hand.
#
# series_break: list the series whose trend is not comparable across this date, e.g.
#   [vacancies, skills, seniority, salaries]. The trends page draws a marker at `date`.

entries:
  - date: "2026-09-20"
    version: "0.5.0"
    title:
      nl: Percentage stage + junior eerlijker berekend; onvolledige maanden gemarkeerd
      en: A fairer internship + junior percentage, and incomplete months marked
    body:
      nl: >-
        Het percentage stage + junior werd afgezet tegen alle vacatures, terwijl ongeveer twee
        derde van de vacatures geen niveau noemt. Daardoor leek het aandeel starters veel
        kleiner dan het is: 5% in plaats van 13% van de vacatures die wel een niveau noemen.
        We rekenen nu af tegen die laatste groep; hoeveel vacatures geen niveau noemen staat er
        als apart cijfer naast. Verder markeren we maanden die al voorbij waren toen we met
        dagelijks ophalen begonnen als onvolledig, omdat we daarvan alleen de advertenties
        hebben die toen nog online stonden; ze tellen niet mee in trends. Een lopende maand
        wordt nu wel elke dag bijgewerkt: eerder kon die blijven staan op de stand van de
        eerste dag.
      en: >-
        The internship + junior percentage was expressed against all vacancies, while about two
        thirds of them state no level. That made the share of starter roles look far smaller
        than it is: 5% instead of 13% of the vacancies that do state a level. We now express it
        against that group, with the number of vacancies without a level beside it. We also
        mark months that were already over when the daily collection started as incomplete,
        because we only have the ads that were still online then; they are left out of trends.
        A running month is now updated every day: it could previously stay frozen at the count
        of its first day.
    series_break: [seniority]
  - date: "2026-09-20"
    version: "0.4.0"
    title:
      nl: Elke dag vacatures ophalen in plaats van elke week
      en: Collecting vacancies daily instead of weekly
    body:
      nl: >-
        Een vacature staat soms maar een paar dagen online. Met een wekelijkse ophaalronde
        misten we die; vanaf nu halen we elke dag de vacatures van de afgelopen twee dagen op.
        Verder terugkijken dan de start van de reeks kan niet: de bron levert alleen vacatures
        die nu nog online staan, en daarvan is na een maand nog ongeveer 30% over en na een half
        jaar ongeveer 5%. Tellingen over die maanden zouden dus een daling laten zien die er
        nooit was. Wat we alsnog uit het verleden ophalen, gebruiken we daarom alleen om de
        indeelregels te controleren.
      en: >-
        A vacancy is sometimes online for only a few days. A weekly collection round missed
        those; from now on we collect the vacancies of the past two days every day. Looking
        further back than the start of the series is not possible: the source only serves
        vacancies still online, of which about 30% remain after a month and about 5% after six
        months. Counts for those months would show a decline that never happened. Anything we
        do collect from the past is therefore used only to check the classification rules.
    series_break: []
  - date: "2026-09-20"
    version: "0.3.0"
    title:
      nl: Meervoudige functietitels tellen mee; officiele verdeling per provincie erbij
      en: Plural job titles now count; official spread per province added
    body:
      nl: >-
        Advertenties met een meervoudige titel ("Software Engineers", "Business Analisten")
        werden niet aan een opleiding gekoppeld en soms helemaal niet als ICT-vacature herkend,
        omdat de regels in het enkelvoud staan. Meervoudsvormen van functiewoorden tellen nu
        mee. Verder halen we de CBS-cijfers over openstaande vacatures in de sector Informatie
        en communicatie voor alle twaalf provincies op, zodat onze verdeling naast de officiele
        verdeling staat, en beschrijft de methode hoe compleet de kaart is.
      en: >-
        Ads with a plural title ("Software Engineers", "Business Analisten") were not linked to
        a programme, and sometimes not recognised as an ICT vacancy at all, because the rules
        are written in the singular. Plural forms of role nouns now count. We also collect the
        CBS figures on open vacancies in the Information and communication sector for all twelve
        provinces, so our spread sits next to the official one, and the method describes how
        complete the map is.
    series_break: []
  - date: "2026-09-20"
    version: "0.2.0"
    title:
      nl: Regio-indeling van het CBS en een kaart per COROP-gebied
      en: CBS area classification and a map per COROP area
    body:
      nl: >-
        De koppeling van een vacature aan een regio liep eerst via een met de hand gemaakte
        gemeentelijst die alleen voor Noord-Holland compleet was. Nu gebruiken we de
        gebiedsindelingen van het CBS (2010 tot nu): elke gemeentenaam, ook die van opgeheven
        gemeenten zoals Naarden en Sneek, hoort bij een COROP-gebied, een arbeidsmarktregio en
        een provincie. Daardoor krijgen vacatures buiten Noord-Holland alsnog een regio, en
        liggen de regiocijfers van eerdere maanden hoger dan eerder getoond. Nieuw is de kaart
        met het aantal vacatures per COROP-gebied.
      en: >-
        Linking a vacancy to a region used to run through a hand-made municipality list that was
        complete for Noord-Holland only. We now use the CBS area classifications (2010 to now):
        every municipality name, including those of abolished municipalities such as Naarden and
        Sneek, belongs to a COROP area, a labour market region and a province. Vacancies outside
        Noord-Holland therefore now get a region, and the regional figures for earlier months are
        higher than shown before. New is the map with the number of vacancies per COROP area.
    series_break: [regions]
  - date: "2026-09-19"
    version: "0.1.0"
    title:
      nl: Eerste versie van de methode
      en: First version of the method
    body:
      nl: >-
        Eerste opzet van ontdubbeling, seniorityclassificatie, koppeling aan opleidingen en
        skill-extractie, bijgesteld op basis van de eerste 30 dagen Adzuna-data. Adzuna levert
        alleen de eerste ~500 tekens van een vacaturetekst; skills en ervaringseisen die later in
        de tekst staan worden dus niet gezien. Stagevergoedingen worden apart geteld en niet
        gemengd met salarissen. Nog niet getoetst op een handmatig gelabelde steekproef.
      en: >-
        First version of deduplication, seniority classification, programme mapping and skill
        extraction, revised against the first 30 days of Adzuna data. Adzuna provides only the
        first ~500 characters of a posting, so skills and experience requirements further down
        the text are not seen. Internship allowances are counted separately and never mixed
        with salaries. Not yet measured against a manually labelled sample.
    series_break: []
