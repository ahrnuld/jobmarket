[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jobmarket"
version = "0.1.0"
description = "Data pipeline for the HBO-ICT job market insights website"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "tzdata>=2024.1",  # time zones for the scheduler in slim containers without system tzdata
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
jobmarket = "jobmarket.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobmarket = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
